# Giga Couch platform API. Same shape as the education app: one small
# machine in iad that sleeps when nobody is using it.

app = 'gigacouch-platform'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  PACKAGES_DIR = '/data/packages'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[mounts]]
  source = 'gigacouch_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
