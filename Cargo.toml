[workspace]
members = ["apps/cli", "crates/manifests", "crates/local-library"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
couch-manifests = { path = "crates/manifests" }
couch-local-library = { path = "crates/local-library" }

# Keep local builds small on machines with limited disk space.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
